[package]
name = "session-panel-observer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.53.3", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_UI_WindowsAndMessaging"] }
