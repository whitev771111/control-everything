<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台</title>
  <link rel="stylesheet" href="/progress.css">
  <script src="/progress.js" defer></script>
</head>
<body>
  <div class="desk">
    <header class="topbar">
      <div>
        <p class="date" id="progress-date"></p>
        <h1>工作台</h1>
      </div>
      <nav aria-label="工作空间入口"><a class="back" href="/workspace">工作台</a> <a class="back" href="/">会话指挥室</a></nav>
    </header>
    <div class="zones">
      <section class="zone zone-projects">
        <header><h2>项目</h2><p>正在做的项目。等你处理的排在前面。</p></header>
        <p id="progress-status" class="status" role="status"></p>
        <div id="progress-board" class="glance"></div>
        <div id="progress-stage"></div>
      </section>
      <section class="zone zone-news">
        <header><h2>新闻</h2><p>每天扫一眼的标题，点开是原文。</p></header>
        <div id="news-zone"></div>
      </section>
      <section class="zone zone-todos">
        <header><h2>待办</h2><p>记在当前选中的项目下面。</p></header>
        <div id="todo-zone"></div>
      </section>
      <section class="zone zone-launch">
        <header><h2>启动</h2><p>按用途分成几组。每组只做一件事。</p></header>
        <div id="launch-zone" class="groups"></div>
      </section>
    </div>
  </div>
</body>
</html>
