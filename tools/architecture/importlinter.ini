[importlinter]
root_package = session_panel

[importlinter:contract:sessions-direction]
name = Sessions do not depend on management composition
type = forbidden
source_modules = session_panel.sessions
forbidden_modules =
    session_panel.profiles
    session_panel.workspace
    session_panel.execution
    session_panel.integrations
    session_panel.http
    session_panel.installation

