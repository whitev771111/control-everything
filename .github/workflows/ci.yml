name: repository-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend/test_execution_ui.cjs tests/frontend/test_progress_ui.cjs tests/frontend/test_workspace_history_ui.cjs

  new-content-checks:
    name: new-content-checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/install_gitleaks.ps1 -Destination work/tools/gitleaks-8.30.1
      - shell: pwsh
        env:
          EVENT_KIND: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if ($env:EVENT_KIND -eq 'pull_request') {
            $baseCommit = $env:PR_BASE
            $headCommit = $env:PR_HEAD
          } else {
            $baseCommit = $env:PUSH_BASE
            $headCommit = $env:PUSH_HEAD
          }
          python scripts/check_repository.py changes --base "$baseCommit" --head "$headCommit" --report work/checks/changes.json
          exit $LASTEXITCODE

  release-readiness:
    name: release-readiness
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/install_gitleaks.ps1 -Destination work/tools/gitleaks-8.30.1
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/checks -Force | Out-Null
          python -c "import json,pathlib,subprocess; r=subprocess.run(['git','ls-files','-z'],capture_output=True,check=True); p=r.stdout.decode('utf-8').rstrip('\0').split('\0'); pathlib.Path('work/checks/candidates.json').write_text(json.dumps({'files':p,'excluded':[]}),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_repository.py release --manifest work/checks/candidates.json --report work/checks/release.json
          exit $LASTEXITCODE
