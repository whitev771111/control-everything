name: repository-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Prepare isolated observer toolchain
        shell: pwsh
        run: |
          $env:RUSTUP_HOME = Join-Path (Get-Location) 'work/native-observer/rustup-home'
          $env:CARGO_HOME = Join-Path (Get-Location) 'work/native-observer/cargo-home'
          $env:CARGO_TARGET_DIR = Join-Path (Get-Location) 'work/native-observer/target'
          rustup set auto-self-update disable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy --no-self-update
          exit $LASTEXITCODE
      - name: Observer format, tests, lint and build
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC build tools are required' }
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:RUSTUP_HOME = Join-Path (Get-Location) 'work/native-observer/rustup-home'
          python scripts/build_observer.py fmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_observer.py test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_observer.py clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_observer.py build
          exit $LASTEXITCODE
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend/test_execution_ui.cjs tests/frontend/test_progress_ui.cjs tests/frontend/test_workspace_history_ui.cjs tests/frontend/test_observation_ui.cjs tests/frontend/test_task_center_ui.cjs

  new-content-checks:
    name: new-content-checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/install_gitleaks.ps1 -Destination work/tools/gitleaks-8.30.1
      - shell: pwsh
        env:
          EVENT_KIND: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if ($env:EVENT_KIND -eq 'pull_request') {
            $baseCommit = $env:PR_BASE
            $headCommit = $env:PR_HEAD
          } else {
            $baseCommit = $env:PUSH_BASE
            $headCommit = $env:PUSH_HEAD
          }
          python scripts/check_repository.py changes --base "$baseCommit" --head "$headCommit" --report work/checks/changes.json
          exit $LASTEXITCODE

  release-readiness:
    name: release-readiness
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/install_gitleaks.ps1 -Destination work/tools/gitleaks-8.30.1
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/checks -Force | Out-Null
          python -c "import json,pathlib,subprocess; r=subprocess.run(['git','ls-files','-z'],capture_output=True,check=True); p=r.stdout.decode('utf-8').rstrip('\0').split('\0'); pathlib.Path('work/checks/candidates.json').write_text(json.dumps({'files':p,'excluded':[]}),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_repository.py release --manifest work/checks/candidates.json --report work/checks/release.json
          exit $LASTEXITCODE
